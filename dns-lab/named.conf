options {
    directory "/mnt/d/TrustGate-IoT/dns-lab";
    listen-on port 15353 { 127.0.0.1; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { localhost; };
    allow-transfer { none; };
    pid-file "/mnt/d/TrustGate-IoT/results/named.pid";
    session-keyfile "/mnt/d/TrustGate-IoT/results/session.key";
};
controls {};
zone "unsigned.trustgate.test" {
    type primary;
    file "zones/unsigned.trustgate.test.zone";
};
zone "trustgate.test" {
    type primary;
    file "zones/trustgate.test.signed";
};
